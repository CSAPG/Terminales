<svg viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg" font-family="Nunito, sans-serif">
  <rect x="0" y="0" width="520" height="220" fill="#FFFFFF"/>

  <!-- fil haut -->
  <line x1="70" y1="40" x2="440" y2="40" stroke="#1A2A3A" stroke-width="2.5"/>
  <!-- générateur E -->
  <circle cx="180" cy="40" r="24" fill="#FFFFFF" stroke="#2D5F8A" stroke-width="2.5"/>
  <text x="160" y="26" font-size="15" font-weight="700" fill="#1A2A3A">+</text>
  <text x="196" y="26" font-size="15" font-weight="700" fill="#1A2A3A">−</text>
  <!-- flèche E au-dessus, pointant vers la gauche -->
  <line x1="215" y1="15" x2="150" y2="15" stroke="#3A8A6E" stroke-width="2" marker-end="url(#arrE)"/>
  <text x="170" y="10" font-size="15" font-weight="700" fill="#3A8A6E">E</text>

  <!-- fil gauche descendant vers l'interrupteur -->
  <line x1="70" y1="40" x2="70" y2="130" stroke="#1A2A3A" stroke-width="2.5"/>
  <!-- interrupteur ouvert -->
  <circle cx="70" cy="130" r="3.5" fill="#1A2A3A"/>
  <line x1="70" y1="130" x2="95" y2="112" stroke="#1A2A3A" stroke-width="2.5"/>
  <circle cx="100" cy="130" r="3.5" fill="#1A2A3A"/>

  <!-- fil bas avec flèche I -->
  <line x1="100" y1="130" x2="440" y2="130" stroke="#1A2A3A" stroke-width="2.5"/>
  <polygon points="150,124 166,130 150,136" fill="#E8783A"/>
  <text x="145" y="116" font-size="15" font-weight="700" fill="#E8783A">I</text>

  <!-- résistance R -->
  <rect x="190" y="118" width="66" height="24" fill="#FFFFFF" stroke="#1A2A3A" stroke-width="2.5"/>
  <text x="205" y="112" font-size="15" font-weight="700" fill="#1A2A3A">R</text>

  <!-- point A -->
  <circle cx="300" cy="130" r="3" fill="#1A2A3A"/>
  <text x="294" y="116" font-size="14" font-weight="700" fill="#1A2A3A">A</text>

  <!-- condensateur -->
  <line x1="330" y1="112" x2="330" y2="148" stroke="#2D5F8A" stroke-width="4"/>
  <line x1="348" y1="112" x2="348" y2="148" stroke="#2D5F8A" stroke-width="4"/>
  <text x="335" y="108" font-size="15" font-weight="700" fill="#2D5F8A">C</text>
  <line x1="300" y1="130" x2="330" y2="130" stroke="#1A2A3A" stroke-width="2.5"/>

  <!-- point B -->
  <circle cx="380" cy="130" r="3" fill="#1A2A3A"/>
  <text x="384" y="116" font-size="14" font-weight="700" fill="#1A2A3A">B</text>
  <line x1="348" y1="130" x2="380" y2="130" stroke="#1A2A3A" stroke-width="2.5"/>

  <!-- flèche uC pointant vers la gauche sous le condensateur -->
  <line x1="378" y1="165" x2="302" y2="165" stroke="#E8783A" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="325" y="182" font-size="14" font-weight="700" fill="#E8783A">u<tspan font-size="10" dy="3">C</tspan></text>

  <!-- fil droit -->
  <line x1="440" y1="40" x2="440" y2="130" stroke="#1A2A3A" stroke-width="2.5"/>

  <defs>
    <marker id="arrE" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3A8A6E"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#E8783A"/>
    </marker>
  </defs>
</svg>
