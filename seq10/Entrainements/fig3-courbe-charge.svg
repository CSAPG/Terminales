<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="Nunito, sans-serif">
  <rect x="0" y="0" width="480" height="300" fill="#FFFFFF"/>

  <!-- axes -->
  <line x1="60" y1="250" x2="450" y2="250" stroke="#1A2A3A" stroke-width="2"/>
  <polygon points="450,244 465,250 450,256" fill="#1A2A3A"/>
  <line x1="60" y1="250" x2="60" y2="30" stroke="#1A2A3A" stroke-width="2"/>
  <polygon points="54,30 60,15 66,30" fill="#1A2A3A"/>
  <text x="455" y="270" font-size="16" fill="#1A2A3A">t</text>
  <text x="35" y="25" font-size="16" fill="#1A2A3A">V<tspan font-size="11" dy="3">C</tspan></text>

  <!-- ligne E (asymptote) -->
  <line x1="60" y1="50" x2="450" y2="50" stroke="#DDE3EC" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="30" y="55" font-size="14" fill="#5A6B7A">E</text>

  <!-- courbe exponentielle de charge : Vc = E(1-e^-t/tau), tau à x=180 -->
  <path d="M 60,250
           C 110,120 140,60 180,55
           S 260,50 450,50"
        fill="none" stroke="#2D5F8A" stroke-width="3"/>

  <!-- repère à t = tau, Vc = 0,63E -->
  <line x1="180" y1="250" x2="180" y2="99" stroke="#E8783A" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="60" y1="99" x2="180" y2="99" stroke="#E8783A" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="180" cy="99" r="4" fill="#E8783A"/>
  <text x="165" y="270" font-size="15" font-weight="700" fill="#E8783A">τ</text>
  <text x="15" y="103" font-size="13" fill="#E8783A">0,63×E</text>
</svg>
