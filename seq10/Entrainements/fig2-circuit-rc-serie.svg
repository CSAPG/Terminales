<svg viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" font-family="Nunito, sans-serif">
  <rect x="0" y="0" width="520" height="260" fill="#FFFFFF"/>

  <!-- boucle -->
  <!-- fil gauche (générateur) -->
  <line x1="60" y1="60" x2="60" y2="200" stroke="#1A2A3A" stroke-width="2.5"/>
  <!-- générateur E (cercle) -->
  <circle cx="60" cy="130" r="26" fill="#FFFFFF" stroke="#2D5F8A" stroke-width="2.5"/>
  <text x="45" y="138" font-size="20" fill="#2D5F8A">∿</text>
  <text x="20" y="135" font-size="18" font-weight="700" fill="#1A2A3A">E</text>

  <!-- fil haut avec flèche I -->
  <line x1="60" y1="60" x2="420" y2="60" stroke="#1A2A3A" stroke-width="2.5"/>
  <polygon points="200,54 216,60 200,66" fill="#E8783A"/>
  <text x="195" y="46" font-size="16" font-weight="700" fill="#E8783A">I</text>

  <!-- résistance R (rectangle) -->
  <rect x="240" y="48" width="70" height="24" fill="#FFFFFF" stroke="#1A2A3A" stroke-width="2.5"/>
  <text x="258" y="42" font-size="18" font-weight="700" fill="#1A2A3A">R</text>

  <!-- fil vers condensateur -->
  <line x1="420" y1="60" x2="420" y2="95" stroke="#1A2A3A" stroke-width="2.5"/>

  <!-- condensateur (deux plaques horizontales) -->
  <line x1="395" y1="100" x2="445" y2="100" stroke="#2D5F8A" stroke-width="4"/>
  <line x1="395" y1="118" x2="445" y2="118" stroke="#2D5F8A" stroke-width="4"/>
  <text x="430" y="95" font-size="18" font-weight="800" fill="#2D5F8A">+</text>
  <text x="450" y="115" font-size="18" font-weight="700" fill="#1A2A3A">C</text>

  <!-- flèche Vc -->
  <line x1="465" y1="150" x2="465" y2="70" stroke="#E8783A" stroke-width="2" marker-end="url(#arrowVc)"/>
  <defs>
    <marker id="arrowVc" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#E8783A"/>
    </marker>
  </defs>
  <text x="466" y="120" font-size="16" font-weight="700" fill="#E8783A">V<tspan font-size="11" dy="3">C</tspan></text>

  <!-- fil bas -->
  <line x1="420" y1="118" x2="420" y2="200" stroke="#1A2A3A" stroke-width="2.5"/>
  <line x1="60" y1="200" x2="420" y2="200" stroke="#1A2A3A" stroke-width="2.5"/>

  <!-- symbole masse Gnd -->
  <line x1="120" y1="200" x2="120" y2="215" stroke="#1A2A3A" stroke-width="2.5"/>
  <line x1="105" y1="215" x2="135" y2="215" stroke="#1A2A3A" stroke-width="2.5"/>
  <line x1="111" y1="222" x2="129" y2="222" stroke="#1A2A3A" stroke-width="2.5"/>
  <line x1="117" y1="229" x2="123" y2="229" stroke="#1A2A3A" stroke-width="2.5"/>
  <text x="140" y="222" font-size="14" fill="#5A6B7A">Gnd</text>
</svg>
